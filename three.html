<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('skiapp:settings') || '{}');
        const dark = saved.theme === 'dark' || (saved.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = dark ? '#111B22' : '#F3F5F2';
      } catch {}
    </script>
    <title>Ski Area Design Challenge — Three.js</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/app/three/main.tsx"></script></body>
</html>
