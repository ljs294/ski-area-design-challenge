  <rect width="960" height="804" fill="#f7f5f0"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1d232a">Dynamic storms: the pattern chain and the anatomy of a storm</text>
  <text x="24" y="56" class="s">One slow layer above the four states makes storms come in streaks (WX-57); each storm evolves inside (WX-24 v2). Every number is from the record.</text>
  <text x="24" y="86" class="b">The chain: one keyed step per storm cycle</text>
