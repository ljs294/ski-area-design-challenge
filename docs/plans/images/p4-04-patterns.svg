  <text x="690" y="560" class="b">Drawn at the storm's start</text>
  <text x="690" y="578" class="s">direction first, then size and warmth</text>
  <text x="690" y="596" class="s">from its compass quarter and pattern</text>
  <text x="690" y="614" class="s">the drawn total always falls: bursts</text>
  <text x="690" y="632" class="s">0.5–1.6 × are renormalised to it</text>
  <text x="690" y="650" class="s">wind and gusts follow the snow rate</text>
  <text x="690" y="668" class="s">the wind veers after the front (arrows)</text>
  <text x="690" y="694" class="b">Then the clearing</text>
  <text x="690" y="712" class="s">colder after a big storm: k × (size −</text>
  <text x="690" y="730" class="s">median), at most 8 °F: a bluebird</text>
  <text x="690" y="748" class="s">morning and a long gun night</text>
  <text x="690" y="766" class="k">rate cap per site: K × its 99.5 % hour</text>
