  <text x="440" y="274" class="s">Built, not counted: this third's mix</text>
  <text x="440" y="291" class="s">(30 · 45 · 25 %) and one persistence per</text>
  <text x="440" y="308" class="s">season half (0.3): stay = 0.3 + 0.7 × mix,</text>
  <text x="440" y="325" class="s">move = 0.7 × mix; every cell ≥ 5 %.</text>
  <rect x="718" y="70" width="218" height="232" rx="10" fill="#fff" stroke="#c9c2b3"/>
  <text x="730" y="94" class="b">No runaway (WX-58)</text>
  <text x="730" y="118" font-size="12" fill="#3e4752" xml:space="preserve">· every move ≥ 5 %: it can't stick</text>
  <text x="730" y="137" font-size="12" fill="#3e4752" xml:space="preserve">· a dwell cap ends a stuck ridge</text>
  <text x="730" y="156" font-size="12" fill="#3e4752" xml:space="preserve">· reads only itself and the date:</text>
  <text x="730" y="175" font-size="12" fill="#3e4752" xml:space="preserve">  never snow, design or player</text>
  <text x="730" y="194" font-size="12" fill="#3e4752" xml:space="preserve">· factors clamped 0.5–1.6, their</text>
  <text x="730" y="213" font-size="12" fill="#3e4752" xml:space="preserve">  product with winter 0.4–2.0</text>
  <text x="730" y="232" font-size="12" fill="#3e4752" xml:space="preserve">· anomaly damped, clamped ±3σ</text>
  <text x="730" y="251" font-size="12" fill="#3e4752" xml:space="preserve">· tested on 200 seeds: dry spells,</text>
  <text x="730" y="270" font-size="12" fill="#3e4752" xml:space="preserve">  season totals, streakiness</text>
  <text x="24" y="366" class="b">A generated January: streaks, never stuck</text>
