<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a98a8"/><stop offset="1" stop-color="#c9d2db"/>
    </linearGradient>
    <pattern id="snow" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.6" fill="#fff"/><circle cx="10" cy="10" r="1.3" fill="#fff"/>
    </pattern>
    <pattern id="rain" width="10" height="14" patternUnits="userSpaceOnUse">
      <path d="M3,1 L1,9" stroke="#3d6b9a" stroke-width="1.2"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d232a"/>
    </marker>
    <style>
      .s{fill:#1d232a;font-size:12.5px}
      .b{fill:#1d232a;font-weight:700;font-size:14px}
      .k{fill:#1d232a;font-size:12px;font-style:italic}
      .tag{fill:#fff;opacity:.88}
    </style>
  </defs>
  <rect width="960" height="560" fill="#f7f5f0"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1d232a">One storm hour across the mountain (§6)</text>
  <text x="24" y="56" font-size="12.5" fill="#3e4752">The site gets one set of numbers per hour; the terrain shapes it, from maps worked out once from the downloaded heights.</text>

  <!-- sky -->
  <rect x="24" y="72" width="912" height="400" fill="url(#sky)" rx="8"/>
  <!-- cloud deck -->
  <path d="M24,72 H936 V150 C820,170 700,140 600,160 C480,180 360,150 240,168 C140,180 80,160 24,170 Z" fill="#6f7d8c" opacity=".85"/>
  <text x="40" y="100" fill="#fff" font-size="13" font-weight="700">cloud deck on the summit (cloud base from the dew-point gap, WX-27)</text>

  <!-- storm arrival -->
  <path d="M40,230 H150" stroke="#1d232a" stroke-width="3" marker-end="url(#a)"/>
  <path d="M40,258 H130" stroke="#1d232a" stroke-width="3" marker-end="url(#a)"/>
  <text x="40" y="218" class="b">storm arrives</text>

  <!-- snow & rain areas -->
  <path d="M150,470 L330,250 L450,190 L520,170 L560,180 Z" fill="url(#snow)"/>
  <rect x="150" y="160" width="430" height="230" fill="url(#snow)" opacity=".9"/>
  <rect x="150" y="390" width="190" height="80" fill="url(#rain)"/>
  <rect x="620" y="250" width="200" height="140" fill="url(#snow)" opacity=".35"/>

  <!-- mountain -->
  <path d="M24,472 L120,462 L200,440 L330,330 L440,230 L520,176 L600,214 L700,300 L780,380 L850,420 L936,428 L936,472 Z" fill="#7b6f5e"/>
  <path d="M330,330 L440,230 L520,176 L600,214 L700,300 L680,312 L600,236 L520,200 L446,250 L346,344 Z" fill="#fff" opacity=".9"/>
  <!-- valley right -->
  <path d="M780,380 L850,420 L936,428 L936,472 L780,472 Z" fill="#6a604f"/>
  <!-- cold pool -->
  <path d="M760,400 C800,404 850,418 936,420 L936,452 L760,452 Z" fill="#b7d3ef" opacity=".75"/>

  <!-- snow line -->
  <path d="M120,390 H560" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
  <rect class="tag" x="122" y="372" width="250" height="16" rx="3"/>
  <text x="128" y="384" fill="#c0392b" font-size="12.5" font-weight="700">snow line: wet bulb 30–34 °F (WX-03 v2)</text>

  <!-- callouts -->
  <rect class="tag" x="560" y="96" width="0" height="0"/>
  <rect class="tag" x="530" y="168" width="196" height="36" rx="4"/>
  <text x="536" y="182" class="s">summit: colder, a foot of snow</text>
  <text x="536" y="198" class="s">more snow up high (gradient)</text>

  <rect class="tag" x="236" y="260" width="196" height="36" rx="4"/>
  <text x="242" y="274" class="b">windward face: more</text>
  <text x="242" y="290" class="s">the storm climbs into it</text>

  <rect class="tag" x="640" y="262" width="184" height="36" rx="4"/>
  <text x="646" y="276" class="b">lee side: less</text>
  <text x="646" y="292" class="s">snow shadow (–30 % at most)</text>

  <rect class="tag" x="160" y="432" width="170" height="34" rx="4"/>
  <text x="166" y="446" class="b">base: rain</text>
  <text x="166" y="461" class="s">guns earn their keep here</text>

  <rect class="tag" x="716" y="350" width="214" height="36" rx="4"/>
  <text x="722" y="364" class="b">cold pool (WX-29)</text>
  <text x="722" y="380" class="s">calm clear nights, up to 8 °F colder</text>

  <!-- legend / footnote -->
  <rect x="24" y="486" width="912" height="62" rx="8" fill="#fff" stroke="#c9c2b3"/>
  <text x="40" y="508" class="s"><tspan font-weight="700">Temperature:</tspan> falls with height by the site's own lapse (day and night differ), minus the cold pool in the valleys.</text>
  <text x="40" y="526" class="s"><tspan font-weight="700">Snow:</tspan> the hour's rate × more with height × windward/lee for the storm's direction; phase by each cell's wet bulb.</text>
  <text x="40" y="542" class="k">A warm storm over a cold pool gives freezing rain in the valley: the real mechanism, no extra state.</text>
</svg>
