name: repo-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test the checks
        run: node --test tools/repo-checks/check.test.mjs
      - name: Agent docs and .meta integrity
        run: node tools/repo-checks/check.mjs

  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Only the small fixtures: the test terrain's heights (TestData/jackson-hole-2km, ~35 MB) are tested
      # locally, to stay inside GitHub's free Git LFS bandwidth (P5). Its canopy, cover and lidar truth
      # (< 1 MB) come along so the D4 forest-rule gate (task 07) runs on every PR.
      - name: Fetch small LFS fixtures
        run: git lfs pull --include="tools/data-spike/tests/DataSpike.Tests/fixtures/*,TestData/s1m-fixture/*,TestData/jackson-hole-2km/canopy-core.grid,TestData/jackson-hole-2km/cover.grid,TestData/jackson-hole-2km/forest-truth.bin"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Engine-free core (the same sources Unity compiles)
        run: dotnet test tools/domain-tests/Tests
      - name: Acquisition CLI builds
        run: dotnet build tools/acquire
      - name: Data spike (offline, recorded fixtures)
        run: dotnet test tools/data-spike/tests/DataSpike.Tests
